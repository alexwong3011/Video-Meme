# Sao chép thành config.toml rồi chỉnh. Mọi khóa đều có giá trị mặc định (xem socialheat/config.py).

[general]
crawl_interval_minutes = 30   # chu kỳ tự động crawl khi chạy `run`
headless = true               # false = hiện cửa sổ trình duyệt khi crawl
chromium_path = ""            # để trống = Chromium do Playwright cài
proxy = ""                    # ví dụ "http://user:pass@host:port" (proxy dân cư giúp ít bị chặn hơn)

[server]
host = "0.0.0.0"              # "127.0.0.1" nếu chỉ dùng trên máy này
port = 8800
username = "admin"            # để trống = không yêu cầu đăng nhập dashboard
password = "doi-mat-khau-nay"

[platforms.facebook]
enabled = true
max_scrolls = 12              # số lần cuộn trang kết quả cho mỗi từ khóa
delay_seconds = [2.0, 5.0]    # nghỉ ngẫu nhiên giữa các thao tác
comments_top_posts = 5        # lấy bình luận của N bài tương tác cao nhất
pages = [
  # "https://www.facebook.com/vnexpress",
  # "https://www.facebook.com/groups/xxxxxxxx",
]

[platforms.tiktok]
enabled = true
max_scrolls = 10
comments_top_posts = 5
pages = [
  # "https://www.tiktok.com/@vtv24news",
]

[platforms.threads]
enabled = true
max_scrolls = 10
comments_top_posts = 5
pages = []

[platforms.news]
enabled = true
google_news = true            # tìm theo từ khóa trên Google News (bao phủ hầu hết báo VN)
# rss = [ ... ]               # danh sách RSS báo, mặc định đã có 10 báo lớn

[scoring]
window_hours = 24
heat_threshold = 50           # ngưỡng chia ma trận
severity_threshold = 50
# heat_weights = { volume = 0.30, engagement = 0.35, velocity = 0.20, spread = 0.15 }
# severity_weights = { negative = 0.25, emotion = 0.15, risk = 0.30, danger = 0.10, mainstream = 0.10, official = 0.10 }

[alerts]
telegram_bot_token = ""       # tạo bot qua @BotFather
telegram_chat_id = ""         # id nhóm/người nhận cảnh báo
cooldown_hours = 6

[llm]
enabled = false               # true = dùng Claude tóm tắt & chấm mức nghiêm trọng (cần ANTHROPIC_API_KEY)
model = "claude-opus-5-5"
interval_hours = 3            # mỗi chủ đề gọi tối đa 1 lần / 3 giờ

# Chủ đề khai báo sẵn (cũng có thể thêm trên dashboard)
[[topics]]
name = "Ngộ độc thực phẩm"
keywords = ["ngộ độc thực phẩm", "ngộ độc & nhập viện"]
exclude = ["quảng cáo"]
