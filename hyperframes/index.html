<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0d0b1a;
        --ink: #f5f3ff;
        --accent: #ff4d8d;
        --accent-2: #4dd2ff;
        --font-display: "Helvetica Neue", Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #title {
        color: var(--ink);
        font-size: 140px;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
      #title em {
        font-style: normal;
        color: var(--accent);
      }
      #bar::after {
        content: "";
        width: 720px;
        height: 12px;
        margin-top: 220px;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }
      #subtitle {
        color: var(--ink);
        font-size: 56px;
        font-weight: 500;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <h1 id="title" class="clip" data-start="0" data-duration="3" data-track-index="0">
        <span>Video <em>Meme</em></span>
      </h1>
      <div id="bar" class="clip" data-start="0" data-duration="3" data-track-index="1"></div>
      <p id="subtitle" class="clip" data-start="3" data-duration="3" data-track-index="2">
        HyperFrames + Remotion + FFmpeg
      </p>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        "#title",
        { scale: 0.92 },
        { scale: 1, duration: 0.9, ease: "power4.out" },
        0,
      );
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.inOut" }, 0.6);
      tl.to(["#title", "#bar"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 2.6);
      tl.fromTo(
        "#subtitle",
        { opacity: 0, y: 30 },
        { opacity: 0.9, y: 0, duration: 0.5, ease: "power3.out" },
        3.0,
      );
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
