<style>
/* Layout: full-screen WebGL scene, HUD pinned to the four corners like a mobile ARPG. Single dark look by design. */
:root{
  --abyss:#041a20;
  --ink:#e8fbff;
  --muted:#93c6cf;
  --gold:#f2c66b;
  --cyan:#6fe7ff;
  --panel:rgba(3,22,28,.66);
  --line:rgba(150,230,255,.24);
  --r-common:#e9f1f2;
  --r-rare:#5fb4ff;
  --r-epic:#c58bff;
  --r-legend:#ffb347;
  --hurt:#ff6b6b;
  --crit:#ffd84d;
  --display:'Cormorant Garamond','Palatino Linotype','Times New Roman',serif;
  --ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--abyss);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,transparent 50%,rgba(0,6,10,.6) 100%)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;text-align:center;white-space:nowrap;will-change:transform}
.lbl .nm{font:600 11px/1.2 var(--ui);letter-spacing:.02em;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.9)}
.lbl .nm.hero{font:700 13px/1.2 var(--display);color:var(--gold);letter-spacing:.06em}
.lbl .hp{width:54px;height:4px;margin:3px auto 0;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.22);border-radius:2px;overflow:hidden}
.lbl .hp i{display:block;height:100%;width:100%;background:linear-gradient(#ff8a7a,#c92f2f);transform-origin:left}
.loot-lbl{font:600 11px var(--ui);text-shadow:0 1px 2px #000,0 0 5px #000}
.dmg{position:absolute;font:700 17px/1 var(--ui);text-shadow:0 2px 3px #000,0 0 8px rgba(0,0,0,.7);animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards;pointer-events:none}
.dmg.crit{font-size:24px;color:var(--crit)}
.dmg.me{color:var(--hurt);font-size:14px}
.dmg.big{font:700 30px/1 var(--display);color:var(--gold);letter-spacing:.08em}
@keyframes rise{0%{transform:translate(-50%,0) scale(1.35);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-52px) scale(1);opacity:0}}

#hud{position:fixed;inset:0;pointer-events:none}
#hud button,#joy{pointer-events:auto}
.card{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px;background:var(--panel);border:1px solid var(--line);border-radius:30px 10px 10px 30px;backdrop-filter:blur(4px)}
.lv{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;align-content:center;background:radial-gradient(circle at 35% 30%,#1d6c80,#06262e);border:2px solid var(--gold);box-shadow:0 0 12px rgba(242,198,107,.35)}
.lv span{font:600 9px var(--ui);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;line-height:1}
.lv b{font:700 20px/1 var(--display);color:var(--gold)}
.hname{font:700 16px/1.1 var(--display);letter-spacing:.04em}
.hname em{font:400 11px var(--ui);color:var(--cyan);font-style:normal;margin-left:6px;letter-spacing:0}
.bar{position:relative;width:150px;height:12px;margin-top:5px;background:rgba(0,0,0,.55);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.14)}
.bar i{position:absolute;inset:0;background:linear-gradient(#ff7d6e,#b8282a);transform-origin:left}
.bar span{position:relative;display:block;text-align:center;font:600 9px/11px var(--ui);font-variant-numeric:tabular-nums;text-shadow:0 1px 1px #000}
.stats{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:6px}
.stats div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;text-align:right;min-width:62px}
.stats span{display:block;font:600 9px var(--ui);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stats b{font:700 15px var(--ui);font-variant-numeric:tabular-nums}
.stats .g b{color:var(--gold)}
#zone{position:absolute;top:calc(78px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;transition:opacity 1.2s;padding-inline:16px}
#zone h1{margin:0;font:700 clamp(26px,6vw,40px)/1 var(--display);letter-spacing:.12em;color:#f4fbff;text-shadow:0 0 18px rgba(111,231,255,.65),0 2px 4px #000;text-wrap:balance}
#zone p{margin:6px 0 0;font:600 11px var(--ui);letter-spacing:.3em;text-transform:uppercase;color:var(--cyan);text-shadow:0 1px 3px #000}
#log{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(170px + env(safe-area-inset-bottom,0px));width:min(300px,70vw);display:flex;flex-direction:column;gap:3px}
#log div{font:600 11px/1.35 var(--ui);text-shadow:0 1px 2px #000,0 0 4px #000;transition:opacity .6s}
#log .rarity-0{color:var(--r-common)}#log .rarity-1{color:var(--r-rare)}#log .rarity-2{color:var(--r-epic)}#log .rarity-3{color:var(--r-legend)}#log .sys{color:var(--cyan)}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:radial-gradient(circle,rgba(111,231,255,.08),rgba(3,22,28,.5));border:1px solid var(--line);touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(190,245,255,.9),rgba(60,160,190,.6));box-shadow:0 0 14px rgba(111,231,255,.5)}
.actions{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:190px;height:150px}
.actions button{position:absolute;border-radius:50%;border:1px solid var(--line);color:var(--ink);font:700 12px var(--ui);cursor:pointer;touch-action:none;display:grid;place-items:center;overflow:hidden}
.actions button:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
#btnAtk{right:0;bottom:0;width:92px;height:92px;background:radial-gradient(circle at 40% 35%,#2b8ea6,#0a3440 70%);box-shadow:0 0 18px rgba(111,231,255,.35),inset 0 0 12px rgba(255,255,255,.12);font:700 18px var(--display);letter-spacing:.06em}
#btnSkill{right:100px;bottom:6px;width:64px;height:64px;background:radial-gradient(circle at 40% 35%,#6a4bc4,#1d1340 72%);box-shadow:0 0 14px rgba(197,139,255,.35)}
#btnSkill .cd{position:absolute;inset:0;background:rgba(0,0,0,.6);transform-origin:bottom;transform:scaleY(0)}
#btnSkill span{position:relative;font-size:10px;line-height:1.15;text-align:center}
#btnAuto{right:22px;bottom:104px;width:54px;height:54px;background:var(--panel);font-size:10px}
#btnAuto[aria-pressed="true"]{background:radial-gradient(circle at 40% 35%,#c99a3c,#4a3008 75%);border-color:var(--gold);box-shadow:0 0 14px rgba(242,198,107,.5)}
.exp{position:absolute;left:0;right:0;bottom:0;height:calc(6px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.55)}
.exp i{position:absolute;left:0;top:0;height:6px;width:100%;background:linear-gradient(90deg,#3fb8ff,#a7f3ff);transform-origin:left;box-shadow:0 0 8px #6fe7ff}
.exp span{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(9px + env(safe-area-inset-bottom,0px));font:600 10px var(--ui);color:var(--muted);font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
.hint{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font:400 11px var(--ui);color:var(--muted);text-shadow:0 1px 2px #000}
@media (pointer:coarse){.hint{display:none}}
@media (max-width:520px){.bar{width:110px}.stats div{min-width:52px;padding:4px 8px}#zone{top:calc(72px + env(safe-area-inset-top,0px))}}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:400 14px/1.5 var(--ui);color:var(--ink)}
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- utilities ----------
let seed = 20261119;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rand();
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = a => a[Math.floor(rand() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function hash3(x, y, z) { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  let r = 0;
  for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 2; dy++) for (let dz = 0; dz < 2; dz++) {
    r += hash3(xi + dx, yi + dy, zi + dz) * (dx ? u : 1 - u) * (dy ? v : 1 - v) * (dz ? w : 1 - w);
  }
  return r;
}
const fbm3 = (x, y, z) => vnoise(x, y, z) * 0.55 + vnoise(x * 2.1, y * 2.1, z * 2.1) * 0.3 + vnoise(x * 4.3, y * 4.3, z * 4.3) * 0.15;

// ---------- renderer ----------
const host = document.getElementById('game');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div id="err">Trình duyệt này không bật được WebGL. Hãy mở bằng Chrome hoặc Safari bản mới.</div>');
  throw e;
}
let DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
host.appendChild(renderer.domElement);

const FOG = new THREE.Color(0x06262e);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x072c35);
scene.fog = new THREE.FogExp2(FOG, 0.022);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.5, 120);

// environment map for metal shine
{
  const envScene = new THREE.Scene();
  const g = new THREE.SphereGeometry(10, 32, 16);
  const cols = [], pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 10;
    const c = new THREE.Color().setRGB(0.02, 0.12, 0.16).lerp(new THREE.Color(1.6, 2.4, 2.6), clamp(y * 0.9 + 0.2, 0, 1) ** 2);
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  envScene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const spot = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 8), new THREE.MeshBasicMaterial({ color: new THREE.Color(6, 7, 7) }));
  spot.position.set(3, 8, 2); envScene.add(spot);
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(envScene, 0.02).texture;
  pm.dispose();
}

scene.add(new THREE.HemisphereLight(0x8fefff, 0x0a2c36, 1.4));
const sun = new THREE.DirectionalLight(0xc8f7ff, 2.4);
sun.position.set(-6, 14, 4);
scene.add(sun);
const heroLight = new THREE.PointLight(0x5ab8ff, 4, 7, 1.6);
scene.add(heroLight);

const U = { uTime: { value: 0 } };

// stylized standard material: adds a coloured rim light
function stylized(params, rim = 0x7fefff, rimStr = 0.5, rimPow = 2.6) {
  const m = new THREE.MeshStandardMaterial(params);
  m.userData.rim = { c: new THREE.Color(rim), s: rimStr, p: rimPow };
  m.onBeforeCompile = (s) => {
    s.uniforms.uRim = { value: m.userData.rim.c };
    s.uniforms.uRimStr = { value: m.userData.rim.s };
    s.uniforms.uRimPow = { value: m.userData.rim.p };
    s.fragmentShader = 'uniform vec3 uRim; uniform float uRimStr; uniform float uRimPow;\n' + s.fragmentShader.replace('#include <opaque_fragment>',
      `{ float fr = pow(1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0), uRimPow);
         outgoingLight += uRim * fr * uRimStr; }
       #include <opaque_fragment>`);
  };
  return m;
}

// ---------- seabed ----------
const NOISE_GLSL = `
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*n2(p); p=p*2.03+vec2(1.7,9.2); a*=0.5; } return v; }
float caustic(vec2 uv, float t){
  vec2 p = uv * 6.2831 - 250.0; vec2 i = p; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}`;
const groundMat = new THREE.ShaderMaterial({
  uniforms: { uTime: U.uTime, uHero: { value: new THREE.Vector3() }, uFog: { value: FOG }, uFogD: { value: 0.022 } },
  vertexShader: `varying vec3 vW; varying float vD;
    void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; vec4 mv = viewMatrix * w; vD = -mv.z; gl_Position = projectionMatrix * mv; }`,
  fragmentShader: NOISE_GLSL + `
    uniform float uTime; uniform vec3 uHero; uniform vec3 uFog; uniform float uFogD;
    varying vec3 vW; varying float vD;
    void main(){
      vec2 p = vW.xz;
      float n = fbm(p * 0.18);
      float warp = fbm(p * 0.07 + 4.0);
      float rip = sin(p.x * 1.9 + p.y * 0.55 + warp * 9.0) * 0.5 + 0.5;
      rip = smoothstep(0.62, 1.0, rip) * 0.9 + smoothstep(0.0, 0.35, rip) * -0.25;
      vec3 sandA = vec3(0.045, 0.13, 0.15);
      vec3 sandB = vec3(0.17, 0.30, 0.29);
      vec3 col = mix(sandA, sandB, smoothstep(0.25, 0.8, n));
      col *= 0.82 + 0.32 * rip;
      float grain = h21(floor(p * 40.0));
      col *= 0.94 + grain * 0.1;
      float patchN = fbm(p * 0.045 + 3.1);
      col = mix(col, vec3(0.03, 0.10, 0.13), smoothstep(0.5, 0.78, patchN) * 0.7);
      float c = caustic(p * 0.11, uTime * 0.55);
      float c2 = caustic(p * 0.23 + 3.0, uTime * 0.4);
      col += vec3(0.25, 0.75, 0.85) * (c * 0.35 + c2 * 0.15) * (0.6 + 0.4 * n);
      float d = length(p - uHero.xz);
      col += vec3(0.08, 0.22, 0.6) * exp(-d * d * 0.12) * 0.8;
      float r = length(p);
      col *= mix(1.0, 0.25, smoothstep(24.0, 40.0, r));
      float f = 1.0 - exp(-uFogD * uFogD * vD * vD);
      gl_FragColor = vec4(mix(col, uFog, f), 1.0);
    }`
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(80, 96).rotateX(-Math.PI / 2), groundMat);
scene.add(ground);

const colliders = [];
const blobTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'); const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(0,0,0,0.75)'); g.addColorStop(0.55, 'rgba(0,0,0,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
})();
const blobMat = new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false, opacity: 0.8 });
const blobGeo = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
function blob(size) { const m = new THREE.Mesh(blobGeo, blobMat); m.scale.set(size, 1, size); m.position.y = 0.02; m.renderOrder = 1; return m; }

// ---------- rocks ----------
function rockGeo(r, h, jag) {
  const g = new THREE.IcosahedronGeometry(1, 3);
  const p = g.attributes.position, cols = [];
  const off = rr(0, 100);
  const top = new THREE.Color(0x4fae94), mid = new THREE.Color(0x1f5d63), low = new THREE.Color(0x0b2a33), tip = new THREE.Color(0x9ff2d8);
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const n = fbm3(v.x * 1.6 + off, v.y * 1.6, v.z * 1.6);
    const spike = Math.pow(vnoise(v.x * 3 + off, v.y * 3, v.z * 3), 3) * jag;
    v.multiplyScalar(0.72 + n * 0.55 + spike);
    v.y = v.y < 0 ? v.y * 0.25 : v.y * h * (1 + spike * 0.6);
    v.x *= r; v.z *= r;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  const nrm = g.attributes.normal;
  for (let i = 0; i < p.count; i++) {
    const ny = nrm.getY(i), y = p.getY(i);
    const c = low.clone().lerp(mid, clamp(y / (h * 0.6) + 0.3, 0, 1));
    c.lerp(top, clamp(ny * 1.3 - 0.2, 0, 1) * 0.85);
    if (y > h * 0.95) c.lerp(tip, 0.35);
    c.multiplyScalar(0.85 + vnoise(p.getX(i) * 4, y * 4, p.getZ(i) * 4) * 0.3);
    cols.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  return g;
}
const rockMat = stylized({ vertexColors: true, roughness: 0.85, metalness: 0.05, flatShading: true, envMapIntensity: 0.6 }, 0x6ff0ff, 0.35, 3.0);

function motes(count, area, color, size, rise) {
  const g = new THREE.BufferGeometry();
  const p = new Float32Array(count * 3), s = new Float32Array(count);
  for (let i = 0; i < count; i++) { p[i * 3] = rr(-area, area); p[i * 3 + 1] = rr(0, 9); p[i * 3 + 2] = rr(-area, area); s[i] = rr(0.4, 1); }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('aS', new THREE.BufferAttribute(s, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uC: { value: new THREE.Color(color) }, uSize: { value: size }, uRise: { value: rise }, uScale: { value: innerHeight * DPR * 0.5 }, uCenter: { value: new THREE.Vector3() } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `uniform float uTime, uSize, uRise, uScale; uniform vec3 uCenter; attribute float aS; varying float vA;
      void main(){ vec3 p = position;
        p.y = mod(p.y + uTime * uRise * aS, 9.0);
        p.x += sin(uTime * 0.5 + position.z) * 0.4; p.z += cos(uTime * 0.4 + position.x) * 0.4;
        p.xz = uCenter.xz + mod(p.xz - uCenter.xz + ${area.toFixed(1)}, ${(area * 2).toFixed(1)}) - ${area.toFixed(1)};
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_PointSize = uSize * aS * uScale / -mv.z;
        vA = smoothstep(0.0, 1.0, p.y) * smoothstep(9.0, 6.0, p.y) * (0.5 + 0.5 * sin(uTime * 2.0 + position.x * 3.0));
        gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 uC; varying float vA;
      void main(){ float d = length(gl_PointCoord - 0.5); float a = smoothstep(0.5, 0.0, d); a *= a; gl_FragColor = vec4(uC * a * vA, 1.0); }`
  });
  const pts = new THREE.Points(g, m); pts.frustumCulled = false; scene.add(pts);
  return m;
}

  fragmentShader: `varying vec3 vC; varying float vA;

let pCursor = 0;
function emit(x, y, z, vx, vy, vz, color, size, life, grav = 0, drag = 0.96) {
  const p = parts[pCursor]; pCursor = (pCursor + 1) % PMAX;
  Object.assign(p, { x, y, z, vx, vy, vz, life, max: life, s: size, grav, drag, r: color.r, g: color.g, b: color.b });
}
function burst(x, y, z, n, color, speed, size, life) {
  for (let i = 0; i < n; i++) {
    const a = rr(0, 6.28), e = rr(-0.3, 1.1), s = rr(0.3, 1) * speed;
    emit(x, y, z, Math.cos(a) * Math.cos(e) * s, Math.sin(e) * s, Math.sin(a) * Math.cos(e) * s, color, size * rr(0.6, 1.3), life * rr(0.6, 1.2), -1.5, 0.93);
  }

function updateParticles(dt) {

    const p = parts[i];
    if (p.life > 0) {

      const k = Math.pow(p.drag, dt * 60);
      p.vx *= k; p.vy = p.vy * k + p.grav * dt; p.vz *= k;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    }
    const t = Math.max(0, p.life / p.max);
    pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.y; pPos[i * 3 + 2] = p.z;
    pCol[i * 3] = p.r; pCol[i * 3 + 1] = p.g; pCol[i * 3 + 2] = p.b;
    pSize[i] = p.s * (0.4 + 0.6 * t); pAl[i] = p.life > 0 ? t : 0;

}

    floatText(hero.pos.x, 3.4, hero.pos.z, 'LÊN CẤP!', 'big');
    logLine(`Đạt cấp ${hero.lv}. Sức mạnh tăng lên.`, 'sys');
    for (let i = 0; i < 60; i++) { const a = (i / 60) * 6.28; emit(hero.pos.x + Math.cos(a) * 1.2, 0.2, hero.pos.z + Math.sin(a) * 1.2, Math.cos(a) * 0.6, rr(3, 6), Math.sin(a) * 0.6, new THREE.Color(0xffe08a), 0.45, 1.2, -1, 0.97); }
  }
  updateHud();
}
let levelFx = 0;
function attack() {
  if (hero.atkCd > 0) return;
  hero.atkCd = 0.6; hero.atkT = 0.001; fadeTo(rand() < 0.5 ? '2H_Melee_Attack_Slice' : '2H_Melee_Attack_Chop', 0.08, true, 1.7);
  slash.visible = true; slashMat.uniforms.uT.value = 0;
  slash.position.set(hero.pos.x, heroG.position.y + 0.9, hero.pos.z);
  slash.rotation.y = hero.face - Math.PI / 2;
  setTimeout(() => {
    for (const m of mobs) {
      if (m.dead) continue;
      const dx = m.x - hero.pos.x, dz = m.z - hero.pos.z, d = Math.hypot(dx, dz);
      if (d > 2.6) continue;
      let da = Math.atan2(dx, dz) - hero.face; da = Math.atan2(Math.sin(da), Math.cos(da));
      if (Math.abs(da) < 1.25 || d < 0.9) { const [dmg, c] = heroDamage(22); hitMob(m, dmg, c); }
    }
  }, 120);
}
function skill() {
  if (hero.skillCd > 0) return;
  hero.skillCd = 6; hero.skillT = 0.001; fadeTo('2H_Melee_Attack_Spin', 0.08, true, 1.5);
  skillRing.visible = true; skillMat.uniforms.uT.value = 0;
  skillRing.position.set(hero.pos.x, 0.6, hero.pos.z);
  for (let i = 0; i < 70; i++) { const a = rr(0, 6.28), s = rr(4, 9); emit(hero.pos.x, 1, hero.pos.z, Math.cos(a) * s, rr(0, 2), Math.sin(a) * s, new THREE.Color(i % 3 ? 0xb98cff : 0x7fe9ff), 0.45, 0.7, 0, 0.9); }
  setTimeout(() => {
    for (const m of mobs) { if (m.dead) continue; if (Math.hypot(m.x - hero.pos.x, m.z - hero.pos.z) < 4.6) { const [dmg, c] = heroDamage(48); hitMob(m, dmg, c); } }
  }, 180);
}

// ---------- update ----------
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3(), camPos = new THREE.Vector3();
let fpsAcc = 0, fpsN = 0, fpsCheck = 0;

function updateHero(dt, t) {
  let mx = input.x, mz = input.z;
  if (input.keys.KeyW || input.keys.ArrowUp) mz -= 1;
  if (input.keys.KeyS || input.keys.ArrowDown) mz += 1;
  if (input.keys.KeyA || input.keys.ArrowLeft) mx -= 1;
  if (input.keys.KeyD || input.keys.ArrowRight) mx += 1;
  let mag = Math.hypot(mx, mz);
  const manual = mag > 0.12;
  if (!manual && auto) {
    // pick up nearby loot first, else hunt nearest mob
    let target = null, best = 1e9;
    for (const l of loots) { const d = Math.hypot(l.x - hero.pos.x, l.z - hero.pos.z); if (d < 9 && d < best) { best = d; target = { x: l.x, z: l.z, loot: true }; } }
    if (!target) for (const m of mobs) { if (m.dead) continue; const d = Math.hypot(m.x - hero.pos.x, m.z - hero.pos.z) - (m.aggro ? 3 : 0); if (d < best) { best = d; target = m; } }
    if (target) {
      const dx = target.x - hero.pos.x, dz = target.z - hero.pos.z, d = Math.hypot(dx, dz);
      if (target.loot) { if (d > 0.3) { mx = dx / d; mz = dz / d; mag = 1; } }
      else if (d > 1.9) { mx = dx / d; mz = dz / d; mag = 1; }
      else {
        hero.face = Math.atan2(dx, dz);
        let near = 0; for (const m of mobs) if (!m.dead && Math.hypot(m.x - hero.pos.x, m.z - hero.pos.z) < 4.2) near++;
        if (near >= 2 && hero.skillCd <= 0) skill(); else attack();
      }
    }
  }
  if (mag > 0.12) {
    const s = Math.min(mag, 1) * 4.6;
    const nx = hero.pos.x + (mx / Math.max(mag, 1)) * s * dt, nz = hero.pos.z + (mz / Math.max(mag, 1)) * s * dt;
    if (!collides(nx, hero.pos.z, 0.5)) hero.pos.x = nx;
    if (!collides(hero.pos.x, nz, 0.5)) hero.pos.z = nz;
    const r = Math.hypot(hero.pos.x, hero.pos.z); if (r > 21) { hero.pos.x *= 21 / r; hero.pos.z *= 21 / r; }
    const want = Math.atan2(mx, mz);
    let da = want - hero.face; da = Math.atan2(Math.sin(da), Math.cos(da)); hero.face += da * Math.min(1, dt * 10);
  }
  const moving = mag > 0.12;
  heroG.position.set(hero.pos.x, 0.75 + Math.sin(t * 2.2) * 0.12, hero.pos.z);
  heroG.rotation.y = hero.face;
  heroBody.rotation.x = lerp(heroBody.rotation.x, moving ? 0.22 : 0.0, dt * 5);
  // wings flap
  const flap = Math.sin(t * 2.2 + 0.6);
  wingR.rotation.set(-0.5 + flap * 0.08, -0.12 - flap * 0.22 - (moving ? 0.25 : 0), 0.05 + flap * 0.1);
  wingL.rotation.set(-0.5 + flap * 0.08, 0.12 + flap * 0.22 + (moving ? 0.25 : 0), -0.05 - flap * 0.1);
  if (mixer.m) mixer.m.update(dt);
  if (hero.atkT > 0) {
    hero.atkT += dt; const k = clamp(hero.atkT / 0.38, 0, 1);
    slashMat.uniforms.uT.value = k;
    if (k >= 1) { hero.atkT = 0; slash.visible = false; }
  }
  if (hero.skillT > 0) {
    hero.skillT += dt; const k = clamp(hero.skillT / 0.6, 0, 1);
    skillMat.uniforms.uT.value = k; skillRing.rotation.y = -k * 4;
    if (k >= 1) { hero.skillT = 0; skillRing.visible = false; }
  }
  hero.atkCd = Math.max(0, hero.atkCd - dt);
  hero.skillCd = Math.max(0, hero.skillCd - dt);
  hud.skillCd.style.transform = `scaleY(${hero.skillCd / 6})`;
  hero.hp = Math.min(hero.maxHp, hero.hp + dt * (8 + hero.lv * 2));
  aura.position.set(hero.pos.x, 0.04, hero.pos.z); aura.rotation.y = t * 0.4;
  heroBlob.position.set(hero.pos.x, 0.03, hero.pos.z);
  heroLight.position.set(hero.pos.x, 2.2, hero.pos.z);
  groundMat.uniforms.uHero.value.copy(hero.pos);
  // wing sparkles
  if (rand() < dt * 40) {
    const side = rand() < 0.5 ? -1 : 1, s = rand();
    const lx = side * (0.3 + s * 1.6), ly = 1.4 + s * 0.8 - rr(0, 1.2) * s, lz = -0.5 - s * 0.6;
    const c = Math.cos(hero.face), sn = Math.sin(hero.face);
    emit(hero.pos.x + lx * c + lz * sn, heroG.position.y + ly, hero.pos.z - lx * sn + lz * c, rr(-0.2, 0.2), rr(-0.6, -0.1), rr(-0.2, 0.2), new THREE.Color(rand() < 0.3 ? 0xffffff : 0x7fd8ff), rr(0.12, 0.25), rr(0.8, 1.6), 0, 0.99);
  }
  if (levelFx > 0) { levelFx -= dt; auraMat.uniforms.uC.value.setHex(0xffd36a); } else auraMat.uniforms.uC.value.setHex(0x4fc8ff);
}

function updateMobs(dt, t) {
  for (const m of mobs) {
    const g = m.group;
    if (m.dead) {
      if (m.dead === 1) { m.deadT = 0; m.dead = 2; }
      m.deadT += dt;
      const k = clamp(1 - m.deadT / 0.4, 0, 1);
      g.scale.setScalar(m.scale * (0.2 + 0.8 * k)); g.visible = k > 0; m.shadow.visible = k > 0;
      m.label.el.style.display = 'none';
      m.respawn -= dt;
      if (m.respawn <= 0) {
        const [x, z] = spawnPos(m.zone); m.x = m.tx = x; m.z = m.tz = z; m.hp = m.maxHp; m.dead = 0; m.aggro = false; m.state = 'idle'; m.wait = 1;
        g.visible = true; m.shadow.visible = true; m.spawnT = 0.6;
        burst(x, m.T.y, z, 18, new THREE.Color(0x7fe9ff), 2, 0.3, 0.8);
      }
      continue;
    }
    const dh = Math.hypot(hero.pos.x - m.x, hero.pos.z - m.z);
    let moving = false;
    if (m.aggro) {
      if (dh > 14) m.aggro = false;
      else if (dh > 1.6) { m.tx = hero.pos.x; m.tz = hero.pos.z; moving = true; }
      else {
        m.face = Math.atan2(hero.pos.x - m.x, hero.pos.z - m.z);
        m.atkCd -= dt;
        if (m.atkCd <= 0) { m.atkCd = rr(1.4, 2.2); m.lunge = 0.3; const dmg = ri(4, 9) + m.lv; hero.hp = Math.max(1, hero.hp - dmg); floatText(hero.pos.x, 2.6, hero.pos.z, '-' + dmg, 'me'); }
      }
    } else {
      m.wait -= dt;
      if (m.wait <= 0) {
        if (m.state === 'idle') { const a = rr(0, 6.28), d = rr(1, m.zone.r * 0.8); m.tx = m.zone.x + Math.cos(a) * d; m.tz = m.zone.z + Math.sin(a) * d; m.state = 'move'; }
        else { m.state = 'idle'; m.wait = rr(1.5, 4); }
      }
      if (m.state === 'move') moving = true;
    }
    if (moving) {
      const dx = m.tx - m.x, dz = m.tz - m.z, d = Math.hypot(dx, dz);
      if (d < 0.3) { if (!m.aggro) { m.state = 'idle'; m.wait = rr(1.5, 4); } }
      else {
        const sp = m.T.speed * (m.aggro ? 1.8 : 1);
        const nx = m.x + dx / d * sp * dt, nz = m.z + dz / d * sp * dt;
        if (!collides(nx, nz, 0.5)) { m.x = nx; m.z = nz; } else if (!m.aggro) { m.state = 'idle'; m.wait = 0.5; }
        const want = Math.atan2(dx, dz); let da = want - m.face; da = Math.atan2(Math.sin(da), Math.cos(da)); m.face += da * Math.min(1, dt * 4);
      }
    }
    let y = m.T.y;
    if (m.kind === 'jelly') {
      const pulse = Math.sin(t * 2.6 + m.phase);
      y += Math.sin(t * 1.3 + m.phase) * 0.25 + pulse * 0.08;
      m.bell.scale.set(1 + pulse * 0.08, 1 - pulse * 0.12, 1 + pulse * 0.08);
      m.mats[0].uniforms.uFlash.value = m.flash;
      g.rotation.set(Math.sin(t * 0.9 + m.phase) * 0.12, t * 0.3 + m.phase, Math.cos(t * 0.8 + m.phase) * 0.12);
    } else {
      y += Math.sin(t * 1.8 + m.phase) * 0.1;
      m.tail.rotation.y = Math.sin(t * (moving ? 12 : 5) + m.phase) * 0.45;
      g.rotation.set(0, m.face + Math.sin(t * (moving ? 12 : 5) + m.phase) * 0.06, Math.sin(t * 1.4 + m.phase) * 0.08);
      m.mats[0].emissive.setScalar(m.flash * 1.2);
    }
    let lz = 0;
    if (m.lunge > 0) { m.lunge -= dt; lz = Math.sin((m.lunge / 0.3) * Math.PI) * 0.5; }
    m.flash = Math.max(0, m.flash - dt * 6);
    const sc = m.spawnT > 0 ? (m.spawnT -= dt, 1 - m.spawnT / 0.6) : 1;
    g.scale.setScalar(m.scale * clamp(sc, 0.05, 1));
    g.position.set(m.x + Math.sin(m.face) * lz, y, m.z + Math.cos(m.face) * lz);
    m.shadow.position.set(m.x, 0.025, m.z);
  }
}

function updateLoot(dt, t) {
  for (let i = loots.length - 1; i >= 0; i--) {
    const l = loots[i]; l.t += dt;
    l.gem.rotation.y = t * 2; l.gem.position.y = 0.45 + Math.sin(t * 3 + i) * 0.08 + Math.max(0, 1.2 - l.t * 3) * Math.sin(Math.min(l.t * 3, 1) * Math.PI);
    if (Math.hypot(l.x - hero.pos.x, l.z - hero.pos.z) < 0.9 || l.t > 40) {
      if (l.t <= 40) {
        if (l.isGold) { hero.gold += l.amount; logLine(`Nhặt được <b>${l.name}</b>`, 'rarity-0'); }
        else { hero.items++; logLine(`Nhặt được <b>[${l.name}]</b> · ${RARITY[l.r].n}`, 'rarity-' + l.r); }
        burst(l.x, 0.5, l.z, 10, new THREE.Color(l.isGold ? 0xffd36a : RARITY[l.r].c), 2, 0.25, 0.5);
        updateHud();
      }
      scene.remove(l.g); l.el.remove(); loots.splice(i, 1);
    }
  }
}

const heroLabel = makeLabel('Hải Kỵ', 'var(--gold)', 'hero'); heroLabel.hpEl.remove();
function updateLabels() {
  const place = (el, x, y, z) => {
    const [sx, sy, vis] = toScreen(x, y, z);
    if (!vis || sx < -80 || sx > innerWidth + 80 || sy < -40 || sy > innerHeight + 40) { el.style.display = 'none'; return; }
    el.style.display = ''; el.style.transform = `translate(${sx}px,${sy}px) translate(-50%,-100%)`;
  };
  for (const m of mobs) {
    if (m.dead) continue;
    place(m.label.el, m.x, m.T.y * m.scale + (m.kind === 'jelly' ? 0.95 : 0.85), m.z);
    m.label.hpEl.style.visibility = m.hp < m.maxHp ? 'visible' : 'hidden';
    m.label.bar.style.transform = `scaleX(${m.hp / m.maxHp})`;
  }
  for (const l of loots) place(l.el, l.x, 1.05, l.z);
  place(heroLabel.el, hero.pos.x, heroG.position.y + HERO_H + 1.0, hero.pos.z);
}

// ---------- post-processing ----------
function makeComposer() {
  const w = innerWidth, h = innerHeight;
  const rt = new THREE.WebGLRenderTarget(w * DPR, h * DPR, { type: THREE.HalfFloatType, samples: 4 });
  const c = new EffectComposer(renderer, rt);
  c.setPixelRatio(DPR); c.setSize(w, h);
  c.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(w / 2, h / 2), 0.55, 0.45, 0.95);
  c.addPass(bloom);
  c.addPass(new OutputPass());
  return c;
}
let composer = makeComposer();

function layoutCamera() {
  const portrait = innerHeight > innerWidth;
  camera.fov = portrait ? 46 : 36;
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
layoutCamera();
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); layoutCamera();
  composer.dispose?.(); composer = makeComposer();
  pMat.uniforms.uScale.value = innerHeight * DPR * 0.5; moteMats.forEach(m => m.uniforms.uScale.value = innerHeight * DPR * 0.5);
});

updateHud();
logLine('Chào mừng đến Vực Lam. Tự động đánh đang bật.', 'sys');

// warm-up so the first visible frame already shows activity
for (let i = 0; i < 60; i++) { updateParticles(1 / 60); }

function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  const t = clock.elapsedTime;
  U.uTime.value = t;
  updateHero(dt, t);
  updateMobs(dt, t);
  updateLoot(dt, t);
  updateParticles(dt);
  moteMats.forEach(m => m.uniforms.uCenter.value.copy(hero.pos));
  shafts.position.set(hero.pos.x * 0.6, 0, hero.pos.z * 0.6);
  // camera
  const portrait = innerHeight > innerWidth;
  const dist = (portrait ? 1.25 : 1) * (PREVIEW ? 0.6 : 1);
  if (PREVIEW) hero.face = 0;
  camTarget.set(hero.pos.x, 1.0, hero.pos.z);
  camPos.set(hero.pos.x, 11.5 * dist, hero.pos.z + 10 * dist);
  camera.position.lerp(camPos, Math.min(1, dt * 4));
  camera.lookAt(camera.position.x, PREVIEW ? 2.2 : 1.0, camera.position.z - 10 * dist);
  updateLabels();
  composer.render(dt);
  // adaptive quality: drop pixel ratio if the device struggles
  fpsAcc += dt; fpsN++; fpsCheck += dt;
  if (fpsCheck > 4 && DPR > 1) {
    const fps = fpsN / fpsAcc;
    if (fps < 40) { DPR = Math.max(1, DPR - 0.5); renderer.setPixelRatio(DPR); composer.dispose?.(); composer = makeComposer(); pMat.uniforms.uScale.value = innerHeight * DPR * 0.5; moteMats.forEach(m => m.uniforms.uScale.value = innerHeight * DPR * 0.5); }
    fpsAcc = fpsN = fpsCheck = 0;
  }
  requestAnimationFrame(frame);
}
camera.position.set(hero.pos.x, 11.5, hero.pos.z + 10);
requestAnimationFrame(frame);
</script>
